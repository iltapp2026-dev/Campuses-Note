<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Task Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

// ── Constants ─────────────────────────────────────────────────────────────────
const ADMIN_PIN = "7324";

const CAMPUSES = [
  "K8KAT","K8WES","HSKAT","K8RIC","K8EA","K8WIN",
  "HSWIN","K8ORE","K8BGR","K8MSG","HSLIB","K8COL","HSAGG"
];

const CAMPUS_COLORS = {
  K8KAT:"#2563eb", K8WES:"#7c3aed", HSKAT:"#0891b2", K8RIC:"#059669",
  K8EA:"#d97706",  K8WIN:"#dc2626", HSWIN:"#0d9488",  K8ORE:"#7c3aed",
  K8BGR:"#b45309", K8MSG:"#4f46e5", HSLIB:"#16a34a",  K8COL:"#0284c7",
  HSAGG:"#9333ea"
};

const STAFF_MEMBERS = [
  { id:"david",   name:"David Banks",     color:"#e11d48" },
  { id:"mark",    name:"Mark McGee",      color:"#0284c7" },
  { id:"allan",   name:"Allan Rodgers",   color:"#16a34a" },
  { id:"heather", name:"Heather Martinez",color:"#9333ea" },
];

const SECTIONS = [
  ...CAMPUSES.map(c=>({ id:c, name:c, color:CAMPUS_COLORS[c], type:"campus" })),
  ...STAFF_MEMBERS.map(s=>({ ...s, type:"staff" })),
];

const CATEGORIES = [
  { id:"camera",      label:"Camera Issue",        icon:"📷" },
  { id:"phone",       label:"Phone Issue",          icon:"📞" },
  { id:"power",       label:"Power Issue",          icon:"⚡" },
  { id:"computer",    label:"Computer Issue",       icon:"🖥️" },
  { id:"network",     label:"Network Issue",        icon:"🌐" },
  { id:"printer",     label:"Printer Issue",        icon:"🖨️" },
  { id:"wifi",        label:"WiFi Issue",           icon:"📶" },
  { id:"battery",     label:"Battery/Charging",     icon:"🔋" },
  { id:"security",    label:"Security Issue",       icon:"🔒" },
  { id:"maintenance", label:"General Maintenance",  icon:"🔧" },
  { id:"note",        label:"Note/General",         icon:"📝" },
];

const PRIORITIES = [
  { id:"high",   label:"High",   color:"#dc2626", bg:"#fef2f2" },
  { id:"medium", label:"Medium", color:"#d97706", bg:"#fffbeb" },
  { id:"low",    label:"Low",    color:"#059669", bg:"#f0fdf4" },
];

const STATUSES = ["Open","In Progress","Completed"];

const uid = () => Math.random().toString(36).substr(2,9);
const todayStr = () => new Date().toISOString().split("T")[0];
const fmtDate = (d) => d ? new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "No date";
const fmtDateTime = (iso) => {
  if(!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) + " · " +
    d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
};
const isToday = (d) => d === todayStr();
const isOverdue = (d) => d && d < todayStr();
const getSectionColor = (sectionId) => SECTIONS.find(s=>s.id===sectionId)?.color || "#64748b";

// ── Storage ────────────────────────────────────────────────────────────────────
const LS_KEY = "it-task-app-v2";
const loadData = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } };
const saveData = (d) => { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch {} };

// ── Styles ─────────────────────────────────────────────────────────────────────
const S = {
  btn: (color="#1e293b", text="#fff", outline=false) => ({
    background: outline ? "transparent" : color,
    color: outline ? color : text,
    border: `1.5px solid ${color}`,
    borderRadius: 8, padding:"8px 18px", fontSize:13, fontWeight:600,
    cursor:"pointer", transition:"all 0.15s", outline:"none",
  }),
  input: {
    background:"#fff", border:"1.5px solid #e2e8f0", borderRadius:8,
    padding:"9px 13px", fontSize:14, color:"#1e293b", outline:"none",
    width:"100%", boxSizing:"border-box", fontFamily:"inherit",
    transition:"border 0.15s",
  },
  card: {
    background:"#fff", border:"1px solid #e2e8f0", borderRadius:12,
    padding:"18px 20px", boxShadow:"0 1px 4px #0000000a",
  },
  label: {
    fontSize:11, fontWeight:700, color:"#64748b", textTransform:"uppercase",
    letterSpacing:0.6, marginBottom:5, display:"block",
  },
};

// ── Live Clock ─────────────────────────────────────────────────────────────────
function LiveClock() {
  const [now, setNow] = useState(new Date());
  useEffect(()=>{ const t = setInterval(()=>setNow(new Date()),1000); return ()=>clearInterval(t); },[]);
  return (
    <div style={{textAlign:"right"}}>
      <div style={{fontSize:28,fontWeight:800,color:"#fff",lineHeight:1,letterSpacing:-1}}>
        {now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true})}
      </div>
      <div style={{fontSize:13,color:"#93c5fd",marginTop:2}}>
        {now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
      </div>
    </div>
  );
}

// ── Login ──────────────────────────────────────────────────────────────────────
function Login({ onLogin }) {
  const [pin,setPin] = useState("");
  const [err,setErr] = useState(false);
  const [shake,setShake] = useState(false);
  const submit = () => {
    if(pin === ADMIN_PIN) { onLogin(); }
    else { setErr(true); setShake(true); setTimeout(()=>setShake(false),500); setPin(""); }
  };
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Inter','Segoe UI',system-ui,sans-serif"}}>
      <style>{`@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}} @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}`}</style>
      <div style={{background:"#fff",borderRadius:20,padding:"44px 40px",width:360,boxShadow:"0 32px 80px #00000040",animation:"fadeUp 0.4s ease",textAlign:"center",boxSizing:"border-box"}}>
        <div style={{fontSize:40,marginBottom:12}}>🛠️</div>
        <div style={{fontSize:22,fontWeight:800,color:"#0f172a",marginBottom:4}}>IT Task Manager</div>
        <div style={{fontSize:13,color:"#64748b",marginBottom:28}}>All Campuses & Teams · Admin Access</div>
        <div style={{textAlign:"left",marginBottom:16}}>
          <label style={S.label}>Admin PIN</label>
          <input type="password" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
            style={{...S.input,fontSize:22,letterSpacing:8,textAlign:"center",border:`1.5px solid ${err?"#dc2626":"#e2e8f0"}`,animation:shake?"shake 0.5s ease":"none"}}
            placeholder="••••" maxLength={8} autoFocus />
          {err && <div style={{color:"#dc2626",fontSize:12,marginTop:6,textAlign:"center"}}>Incorrect PIN. Try again.</div>}
        </div>
        <button onClick={submit} style={{...S.btn("#1e3a5f"),width:"100%",padding:"12px",fontSize:15,borderRadius:10}}>
          Unlock Dashboard →
        </button>
        <div style={{fontSize:11,color:"#94a3b8",marginTop:20}}>ILTEXAS AOH · IT Operations</div>
      </div>
    </div>
  );
}

// ── Task Modal ─────────────────────────────────────────────────────────────────
function TaskModal({ task, onSave, onClose }) {
  const [form,setForm] = useState(task || {
    title:"", section:CAMPUSES[0], category:"computer", priority:"medium",
    status:"Open", dueDate:"", notes:"", files:[],
    createdAt:new Date().toISOString()
  });
  const fileRef = useRef();
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const handleFiles = (e) => {
    const files = Array.from(e.target.files);
    const newFiles = files.map(f=>({name:f.name,size:f.size,type:f.type,dataUrl:null}));
    const readers = newFiles.map((nf,i)=>new Promise(res=>{
      const r = new FileReader();
      r.onload=()=>{ newFiles[i].dataUrl=r.result; res(); };
      r.readAsDataURL(files[i]);
    }));
    Promise.all(readers).then(()=>set("files",[...(form.files||[]),...newFiles]));
  };

  const removeFile = (i) => set("files",(form.files||[]).filter((_,idx)=>idx!==i));

  const save = () => {
    if(!form.title.trim()) return;
    onSave({...form, id:form.id||uid(), updatedAt:new Date().toISOString()});
  };

  const sectionColor = getSectionColor(form.section);
  const sel = {...S.input, appearance:"none"};

  return (
    <div style={{position:"fixed",inset:0,background:"#00000055",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"#f8fafc",borderRadius:16,width:"100%",maxWidth:560,maxHeight:"92vh",overflow:"auto",boxShadow:"0 24px 64px #00000030",fontFamily:"'Inter','Segoe UI',system-ui,sans-serif"}}>
        <div style={{background:sectionColor,borderRadius:"16px 16px 0 0",padding:"18px 24px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:800,fontSize:16,color:"#fff"}}>{task?"✏️ Edit Task":"➕ New Task"}</div>
          <button onClick={onClose} style={{background:"#ffffff22",border:"none",color:"#fff",width:30,height:30,borderRadius:8,cursor:"pointer",fontSize:16}}>✕</button>
        </div>
        <div style={{padding:"24px"}}>
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <div>
              <label style={S.label}>Task Title *</label>
              <input style={S.input} value={form.title} onChange={e=>set("title",e.target.value)} placeholder="Describe the issue or task…" autoFocus />
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div>
                <label style={S.label}>Section</label>
                <select style={sel} value={form.section} onChange={e=>set("section",e.target.value)}>
                  <optgroup label="── Campuses ──">
                    {CAMPUSES.map(c=><option key={c} value={c}>{c}</option>)}
                  </optgroup>
                  <optgroup label="── Staff ──">
                    {STAFF_MEMBERS.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                  </optgroup>
                </select>
              </div>
              <div>
                <label style={S.label}>Category</label>
                <select style={sel} value={form.category} onChange={e=>set("category",e.target.value)}>
                  {CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
                </select>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div>
                <label style={S.label}>Priority</label>
                <select style={sel} value={form.priority} onChange={e=>set("priority",e.target.value)}>
                  {PRIORITIES.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
                </select>
              </div>
              <div>
                <label style={S.label}>Status</label>
                <select style={sel} value={form.status} onChange={e=>set("status",e.target.value)}>
                  {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            </div>
            <div>
              <label style={S.label}>Due Date</label>
              <input type="date" style={S.input} value={form.dueDate||""} onChange={e=>set("dueDate",e.target.value)} />
            </div>
            <div>
              <label style={S.label}>Notes</label>
              <textarea style={{...S.input,resize:"vertical",minHeight:80}} value={form.notes} onChange={e=>set("notes",e.target.value)} placeholder="Additional details…" />
            </div>
            <div>
              <label style={S.label}>Attachments</label>
              <input ref={fileRef} type="file" accept=".xlsx,.csv,.docx,.pdf,.txt,.png,.jpg" multiple style={{display:"none"}} onChange={handleFiles} />
              <button onClick={()=>fileRef.current.click()} style={{...S.btn("#64748b","#fff",true),width:"100%",marginBottom:8}}>
                📎 Attach Files (Excel, CSV, Word, PDF…)
              </button>
              {(form.files||[]).length>0 && (
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {(form.files||[]).map((f,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#f1f5f9",borderRadius:8,padding:"8px 12px"}}>
                      <span style={{fontSize:12,color:"#334155"}}>📄 {f.name}</span>
                      <button onClick={()=>removeFile(i)} style={{background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:14}}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
          <div style={{display:"flex",gap:10,marginTop:24,justifyContent:"flex-end"}}>
            <button onClick={onClose} style={S.btn("#e2e8f0","#64748b")}>Cancel</button>
            <button onClick={save} style={{...S.btn(sectionColor),minWidth:120}}>💾 Save Task</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── AI Summarize ───────────────────────────────────────────────────────────────
function SummarizeBox({ onAddTask }) {
  const [text,setText] = useState("");
  const [section,setSection] = useState(CAMPUSES[0]);
  const [loading,setLoading] = useState(false);
  const [result,setResult] = useState(null);
  const [err,setErr] = useState("");

  const summarize = async () => {
    if(!text.trim()) return;
    setLoading(true); setResult(null); setErr("");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6", max_tokens:600,
          system:`You are an IT task extractor. Return ONLY valid JSON: {"title":"short task title","notes":"1-2 sentence summary","category":"one of: camera|phone|power|computer|network|printer|wifi|battery|security|maintenance|note","priority":"high|medium|low"}. No markdown, no explanation.`,
          messages:[{role:"user",content:`Extract IT task from:\n\n${text.substring(0,4000)}`}]
        })
      });
      const data = await res.json();
      const raw = (data.content||[]).map(c=>c.text||"").join("").trim().replace(/```json|```/g,"").trim();
      setResult(JSON.parse(raw));
    } catch { setErr("Could not summarize. Try rephrasing or paste simpler text."); }
    setLoading(false);
  };

  const addTask = () => {
    if(!result) return;
    onAddTask({
      id:uid(), title:result.title, section, category:result.category||"note",
      priority:result.priority||"medium", status:"Open", dueDate:"",
      notes:result.notes||"", files:[], createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
    });
    setText(""); setResult(null);
  };

  return (
    <div style={{...S.card,marginBottom:24}}>
      <div style={{fontWeight:700,fontSize:15,color:"#0f172a",marginBottom:4}}>🧠 Smart Paste & Summarize</div>
      <div style={{fontSize:12,color:"#64748b",marginBottom:14}}>Paste anything — email, ticket, notes — AI extracts the task automatically.</div>
      <textarea value={text} onChange={e=>setText(e.target.value)}
        style={{...S.input,resize:"vertical",minHeight:100,marginBottom:12}}
        placeholder="Paste email, ticket content, or any text here…" />
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <select style={{...S.input,width:"auto",minWidth:140}} value={section} onChange={e=>setSection(e.target.value)}>
          <optgroup label="── Campuses ──">
            {CAMPUSES.map(c=><option key={c} value={c}>{c}</option>)}
          </optgroup>
          <optgroup label="── Staff ──">
            {STAFF_MEMBERS.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </optgroup>
        </select>
        <button onClick={summarize} disabled={!text.trim()||loading}
          style={{...S.btn("#1e3a5f"),opacity:!text.trim()||loading?0.5:1}}>
          {loading?"⏳ Summarizing…":"✨ Summarize & Extract"}
        </button>
        {result && <button onClick={()=>{setText("");setResult(null);}} style={S.btn("#e2e8f0","#64748b")}>Clear</button>}
      </div>
      {err && <div style={{color:"#dc2626",fontSize:12,marginTop:10}}>{err}</div>}
      {result && (
        <div style={{marginTop:14,background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:10,padding:"14px 16px"}}>
          <div style={{fontWeight:700,color:"#059669",fontSize:13,marginBottom:8}}>✅ Task Extracted — Review & Add</div>
          <div style={{fontSize:14,fontWeight:600,color:"#0f172a",marginBottom:4}}>{result.title}</div>
          {result.notes && <div style={{fontSize:12,color:"#475569",marginBottom:10}}>{result.notes}</div>}
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:11,background:"#dcfce7",color:"#166534",padding:"2px 8px",borderRadius:10,fontWeight:600}}>{CATEGORIES.find(c=>c.id===result.category)?.icon} {result.category}</span>
            <span style={{fontSize:11,background:"#fef9c3",color:"#854d0e",padding:"2px 8px",borderRadius:10,fontWeight:600}}>{result.priority} priority</span>
            <button onClick={addTask} style={{...S.btn("#059669"),marginLeft:"auto"}}>➕ Add to {SECTIONS.find(s=>s.id===section)?.name||section}</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Task Card ──────────────────────────────────────────────────────────────────
function TaskCard({ task, onEdit, onDelete, onStatusChange }) {
  const cat = CATEGORIES.find(c=>c.id===task.category)||CATEGORIES[0];
  const pri = PRIORITIES.find(p=>p.id===task.priority)||PRIORITIES[1];
  const sec = SECTIONS.find(s=>s.id===task.section);
  const sectionColor = sec?.color || "#64748b";
  const sectionName = sec?.name || task.section;
  const overdue = isOverdue(task.dueDate) && task.status!=="Completed";
  const dueToday = isToday(task.dueDate) && task.status!=="Completed";
  const done = task.status==="Completed";

  return (
    <div style={{...S.card,borderLeft:`4px solid ${done?"#10b981":overdue?"#dc2626":dueToday?"#f59e0b":sectionColor}`,opacity:done?0.7:1,transition:"all 0.2s"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10,gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:0}}>
          <span style={{fontSize:20,flexShrink:0}}>{cat.icon}</span>
          <div style={{fontWeight:700,fontSize:14,color:done?"#94a3b8":"#0f172a",textDecoration:done?"line-through":"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{task.title}</div>
        </div>
        <div style={{display:"flex",gap:6,flexShrink:0,alignItems:"center"}}>
          {(overdue||dueToday)&&!done&&(
            <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,background:overdue?"#fef2f2":"#fffbeb",color:overdue?"#dc2626":"#d97706",border:`1px solid ${overdue?"#fecaca":"#fde68a"}`}}>
              {overdue?"OVERDUE":"TODAY"}
            </span>
          )}
          <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,background:pri.bg,color:pri.color}}>{pri.label}</span>
        </div>
      </div>
      <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:task.notes||task.createdAt?8:0}}>
        <span style={{fontSize:11,color:"#64748b"}}>
          <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:sectionColor,marginRight:4}}></span>
          <strong style={{color:sectionColor}}>{sectionName}</strong>
        </span>
        {task.dueDate&&<span style={{fontSize:11,color:overdue?"#dc2626":dueToday?"#d97706":"#64748b"}}>📅 {fmtDate(task.dueDate)}</span>}
        {(task.files||[]).length>0&&<span style={{fontSize:11,color:"#64748b"}}>📎 {task.files.length} file{task.files.length>1?"s":""}</span>}
      </div>
      {task.notes&&<div style={{fontSize:12,color:"#64748b",lineHeight:1.5,borderTop:"1px solid #f1f5f9",paddingTop:8,marginBottom:6}}>{task.notes.substring(0,120)}{task.notes.length>120?"…":""}</div>}
      {task.createdAt&&(
        <div style={{fontSize:10,color:"#cbd5e1",marginBottom:6}}>🕐 Added {fmtDateTime(task.createdAt)}</div>
      )}
      <div style={{display:"flex",gap:8,alignItems:"center",marginTop:4}}>
        <select value={task.status} onChange={e=>onStatusChange(task.id,e.target.value)}
          style={{fontSize:11,padding:"4px 8px",borderRadius:6,border:"1px solid #e2e8f0",background:"#f8fafc",color:"#334155",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>
          {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <div style={{marginLeft:"auto",display:"flex",gap:6}}>
          <button onClick={()=>onEdit(task)} style={{...S.btn("#e2e8f0","#334155"),padding:"5px 12px",fontSize:11}}>Edit</button>
          <button onClick={()=>onDelete(task.id)} style={{...S.btn("#fef2f2","#dc2626"),padding:"5px 12px",fontSize:11}}>Delete</button>
        </div>
      </div>
    </div>
  );
}

// ── Dashboard ──────────────────────────────────────────────────────────────────
function Dashboard({ tasks, onAddTask }) {
  const active = tasks.filter(t=>t.status!=="Completed");
  const todayTasks = active.filter(t=>isToday(t.dueDate));
  const overdueTasks = active.filter(t=>isOverdue(t.dueDate));
  const done = tasks.filter(t=>t.status==="Completed");
  const hour = new Date().getHours();
  const greeting = hour<12?"Good morning":hour<17?"Good afternoon":"Good evening";

  const stats = [
    {label:"Active Tasks",  value:active.length,      color:"#2563eb", icon:"📋"},
    {label:"Due Today",     value:todayTasks.length,   color:"#d97706", icon:"📅"},
    {label:"Overdue",       value:overdueTasks.length, color:"#dc2626", icon:"🔴"},
    {label:"Completed",     value:done.length,         color:"#059669", icon:"✅"},
  ];

  return (
    <div>
      {/* Hero with live clock */}
      <div style={{background:"linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%)",borderRadius:16,padding:"28px 32px",marginBottom:24,color:"#fff",position:"relative",overflow:"hidden",display:"flex",justifyContent:"space-between",alignItems:"center",gap:20}}>
        <div style={{position:"absolute",top:-30,right:-30,width:180,height:180,background:"#ffffff08",borderRadius:"50%"}}/>
        <div>
          <div style={{fontSize:12,fontWeight:700,letterSpacing:1,textTransform:"uppercase",opacity:0.7,marginBottom:6}}>Welcome back</div>
          <div style={{fontSize:26,fontWeight:800,marginBottom:12}}>{greeting}! 🛠️</div>
          <button onClick={onAddTask} style={{background:"#fff",border:"none",color:"#1e3a5f",padding:"10px 22px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:14}}>
            + New Task
          </button>
        </div>
        <LiveClock />
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:24}}>
        {stats.map(s=>(
          <div key={s.label} style={{...S.card,textAlign:"center",borderTop:`3px solid ${s.color}`}}>
            <div style={{fontSize:24,marginBottom:6}}>{s.icon}</div>
            <div style={{fontSize:30,fontWeight:800,color:s.color,lineHeight:1}}>{s.value}</div>
            <div style={{fontSize:11,color:"#94a3b8",marginTop:4,fontWeight:600}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Alert banner */}
      {(todayTasks.length>0||overdueTasks.length>0)&&(
        <div style={{...S.card,marginBottom:24,border:"1px solid #fde68a",background:"#fffbeb"}}>
          <div style={{fontWeight:800,fontSize:15,color:"#92400e",marginBottom:12}}>⚡ Needs Attention</div>
          {overdueTasks.slice(0,4).map(t=>(
            <div key={t.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #fde68a"}}>
              <span style={{fontSize:13,fontWeight:600,color:"#0f172a"}}>{CATEGORIES.find(c=>c.id===t.category)?.icon} {t.title}</span>
              <span style={{fontSize:11,color:"#dc2626",fontWeight:700}}>OVERDUE · {SECTIONS.find(s=>s.id===t.section)?.name||t.section}</span>
            </div>
          ))}
          {todayTasks.map(t=>(
            <div key={t.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #fde68a"}}>
              <span style={{fontSize:13,fontWeight:600,color:"#0f172a"}}>{CATEGORIES.find(c=>c.id===t.category)?.icon} {t.title}</span>
              <span style={{fontSize:11,color:"#d97706",fontWeight:700}}>TODAY · {SECTIONS.find(s=>s.id===t.section)?.name||t.section}</span>
            </div>
          ))}
        </div>
      )}

      {/* Campuses */}
      <div style={{fontWeight:700,fontSize:15,color:"#0f172a",marginBottom:12}}>🏫 Campuses</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:10,marginBottom:24}}>
        {CAMPUSES.map(campus=>{
          const ct=tasks.filter(t=>t.section===campus&&t.status!=="Completed").length;
          const color=CAMPUS_COLORS[campus]||"#64748b";
          return (
            <div key={campus} style={{...S.card,borderTop:`3px solid ${color}`,textAlign:"center",padding:"14px 12px"}}>
              <div style={{fontWeight:800,color,fontSize:14,marginBottom:4}}>{campus}</div>
              <div style={{fontSize:24,fontWeight:800,color:"#0f172a"}}>{ct}</div>
              <div style={{fontSize:10,color:"#94a3b8"}}>active task{ct!==1?"s":""}</div>
            </div>
          );
        })}
      </div>

      {/* Staff */}
      <div style={{fontWeight:700,fontSize:15,color:"#0f172a",marginBottom:12}}>👤 Staff</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:10}}>
        {STAFF_MEMBERS.map(staff=>{
          const ct=tasks.filter(t=>t.section===staff.id&&t.status!=="Completed").length;
          return (
            <div key={staff.id} style={{...S.card,borderTop:`3px solid ${staff.color}`,textAlign:"center",padding:"14px 12px"}}>
              <div style={{fontWeight:800,color:staff.color,fontSize:13,marginBottom:4}}>{staff.name}</div>
              <div style={{fontSize:24,fontWeight:800,color:"#0f172a"}}>{ct}</div>
              <div style={{fontSize:10,color:"#94a3b8"}}>active task{ct!==1?"s":""}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Tasks View ─────────────────────────────────────────────────────────────────
function TasksView({ tasks, onEdit, onDelete, onStatusChange, onAddTask }) {
  const [section,setSection] = useState("All");
  const [category,setCategory] = useState("all");
  const [priority,setPriority] = useState("all");
  const [status,setStatus] = useState("Active");
  const [search,setSearch] = useState("");

  let filtered = tasks;
  if(section!=="All") filtered=filtered.filter(t=>t.section===section);
  if(category!=="all") filtered=filtered.filter(t=>t.category===category);
  if(priority!=="all") filtered=filtered.filter(t=>t.priority===priority);
  if(status==="Active") filtered=filtered.filter(t=>t.status!=="Completed");
  else if(status==="Completed") filtered=filtered.filter(t=>t.status==="Completed");
  if(search) filtered=filtered.filter(t=>t.title.toLowerCase().includes(search.toLowerCase())||t.notes?.toLowerCase().includes(search.toLowerCase()));
  filtered.sort((a,b)=>{
    if(isOverdue(a.dueDate)&&!isOverdue(b.dueDate)) return -1;
    if(!isOverdue(a.dueDate)&&isOverdue(b.dueDate)) return 1;
    if(a.dueDate&&b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    return 0;
  });

  return (
    <div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:20,alignItems:"center"}}>
        <input style={{...S.input,width:200,flex:1,minWidth:150}} placeholder="🔍 Search tasks…" value={search} onChange={e=>setSearch(e.target.value)}/>
        <select style={{...S.input,width:"auto"}} value={section} onChange={e=>setSection(e.target.value)}>
          <option value="All">All Sections</option>
          <optgroup label="── Campuses ──">
            {CAMPUSES.map(c=><option key={c} value={c}>{c}</option>)}
          </optgroup>
          <optgroup label="── Staff ──">
            {STAFF_MEMBERS.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </optgroup>
        </select>
        <select style={{...S.input,width:"auto"}} value={category} onChange={e=>setCategory(e.target.value)}>
          <option value="all">All Categories</option>
          {CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
        </select>
        <select style={{...S.input,width:"auto"}} value={priority} onChange={e=>setPriority(e.target.value)}>
          <option value="all">All Priorities</option>
          {PRIORITIES.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
        </select>
        <select style={{...S.input,width:"auto"}} value={status} onChange={e=>setStatus(e.target.value)}>
          <option value="Active">Active</option>
          <option value="Completed">Completed</option>
          <option value="All">All</option>
        </select>
        <button onClick={onAddTask} style={S.btn("#1e3a5f")}>+ Add Task</button>
      </div>
      <div style={{fontSize:12,color:"#64748b",marginBottom:14}}>{filtered.length} task{filtered.length!==1?"s":""} found</div>
      {filtered.length===0 ? (
        <div style={{...S.card,textAlign:"center",padding:"48px 20px"}}>
          <div style={{fontSize:36,marginBottom:10}}>📭</div>
          <div style={{fontWeight:700,color:"#64748b"}}>No tasks found</div>
          <div style={{fontSize:13,color:"#94a3b8",marginTop:4}}>Adjust filters or add a new task</div>
        </div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:14}}>
          {filtered.map(t=><TaskCard key={t.id} task={t} onEdit={onEdit} onDelete={onDelete} onStatusChange={onStatusChange}/>)}
        </div>
      )}
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────────
function App() {
  const [loggedIn,setLoggedIn] = useState(false);
  const [tab,setTab] = useState("dashboard");
  const [tasks,setTasks] = useState([]);
  const [showModal,setShowModal] = useState(false);
  const [editingTask,setEditingTask] = useState(null);
  const [loaded,setLoaded] = useState(false);

  useEffect(()=>{
    const d = loadData();
    setTasks(d.tasks||[]);
    setLoaded(true);
  },[]);

  useEffect(()=>{ if(loaded) saveData({tasks}); },[tasks,loaded]);

  const saveTask = useCallback((task)=>{
    setTasks(prev=>task.id&&prev.find(t=>t.id===task.id)
      ? prev.map(t=>t.id===task.id?task:t)
      : [...prev,task]
    );
    setShowModal(false); setEditingTask(null);
  },[]);

  const deleteTask = useCallback((id)=>setTasks(prev=>prev.filter(t=>t.id!==id)),[]);
  const statusChange = useCallback((id,status)=>setTasks(prev=>prev.map(t=>t.id===id?{...t,status,updatedAt:new Date().toISOString()}:t)),[]);
  const openAdd = () => { setEditingTask(null); setShowModal(true); };
  const openEdit = (task) => { setEditingTask(task); setShowModal(true); };
  const todayAlert = tasks.filter(t=>t.status!=="Completed"&&(isToday(t.dueDate)||isOverdue(t.dueDate))).length;

  const TABS = [
    {id:"dashboard", label:"Dashboard", icon:"⚡"},
    {id:"tasks",     label:"All Tasks",  icon:"📋"},
    {id:"summarize", label:"AI Paste",   icon:"🧠"},
  ];

  if(!loggedIn) return <Login onLogin={()=>setLoggedIn(true)} />;

  return (
    <div style={{minHeight:"100vh",background:"#f1f5f9",fontFamily:"'Inter','Segoe UI',system-ui,sans-serif",display:"flex"}}>
      <style>{`*{box-sizing:border-box}select,input,textarea{font-family:inherit}select:focus,input:focus,textarea:focus{border-color:#2563eb!important;outline:none}button:hover{opacity:0.88}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}`}</style>

      {/* Sidebar */}
      <div style={{width:230,background:"#0f172a",display:"flex",flexDirection:"column",flexShrink:0,minHeight:"100vh",position:"sticky",top:0,overflowY:"auto"}}>
        <div style={{padding:"22px 20px 16px",borderBottom:"1px solid #1e293b"}}>
          <div style={{fontSize:15,fontWeight:800,color:"#fff",marginBottom:2}}>🛠️ IT Task Manager</div>
          <div style={{fontSize:10,color:"#475569",letterSpacing:0.5}}>ILTEXAS AOH · All Sections</div>
        </div>

        {/* Nav tabs */}
        <nav style={{padding:"8px 0",borderBottom:"1px solid #1e293b"}}>
          {TABS.map(t=>{
            const active=tab===t.id;
            return (
              <div key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 20px",cursor:"pointer",background:active?"#1e293b":"transparent",borderLeft:`3px solid ${active?"#2563eb":"transparent"}`,color:active?"#60a5fa":"#64748b",fontSize:13,fontWeight:active?700:400,transition:"all 0.15s"}}>
                <span>{t.icon}</span><span>{t.label}</span>
                {t.id==="dashboard"&&todayAlert>0&&<span style={{marginLeft:"auto",background:"#dc2626",color:"#fff",fontSize:9,fontWeight:800,borderRadius:10,padding:"1px 6px"}}>{todayAlert}</span>}
              </div>
            );
          })}
        </nav>

        {/* Campuses in sidebar */}
        <div style={{padding:"14px 20px 8px"}}>
          <div style={{fontSize:10,color:"#475569",fontWeight:700,textTransform:"uppercase",letterSpacing:0.6,marginBottom:10}}>🏫 Campuses</div>
          {CAMPUSES.map(c=>{
            const ct=tasks.filter(t=>t.section===c&&t.status!=="Completed").length;
            return (
              <div key={c} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",cursor:"pointer"}} onClick={()=>{setTab("tasks");}}>
                <span style={{fontSize:12,color:"#94a3b8"}}>
                  <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",background:CAMPUS_COLORS[c]||"#64748b",marginRight:6}}></span>{c}
                </span>
                {ct>0&&<span style={{fontSize:10,background:"#1e293b",color:"#94a3b8",padding:"1px 6px",borderRadius:8}}>{ct}</span>}
              </div>
            );
          })}
        </div>

        {/* Staff in sidebar */}
        <div style={{padding:"8px 20px 14px",borderTop:"1px solid #1e293b",marginTop:4}}>
          <div style={{fontSize:10,color:"#475569",fontWeight:700,textTransform:"uppercase",letterSpacing:0.6,marginBottom:10}}>👤 Staff</div>
          {STAFF_MEMBERS.map(s=>{
            const ct=tasks.filter(t=>t.section===s.id&&t.status!=="Completed").length;
            return (
              <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",cursor:"pointer"}} onClick={()=>setTab("tasks")}>
                <span style={{fontSize:12,color:"#94a3b8"}}>
                  <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",background:s.color,marginRight:6}}></span>{s.name.split(" ")[0]}
                </span>
                {ct>0&&<span style={{fontSize:10,background:"#1e293b",color:"#94a3b8",padding:"1px 6px",borderRadius:8}}>{ct}</span>}
              </div>
            );
          })}
        </div>

        <button onClick={()=>setLoggedIn(false)} style={{margin:"auto 16px 16px",background:"transparent",border:"1px solid #1e293b",color:"#64748b",borderRadius:8,padding:"8px",fontSize:12,cursor:"pointer"}}>
          🔒 Lock
        </button>
      </div>

      {/* Main */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"14px 28px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,boxShadow:"0 1px 4px #0000000a"}}>
          <div>
            <div style={{fontSize:17,fontWeight:800,color:"#0f172a"}}>{TABS.find(t=>t.id===tab)?.icon} {TABS.find(t=>t.id===tab)?.label}</div>
            <div style={{fontSize:11,color:"#94a3b8",marginTop:1}}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
          </div>
          {todayAlert>0&&(
            <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"8px 16px",display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:14}}>🔴</span>
              <span style={{fontSize:13,fontWeight:700,color:"#dc2626"}}>{todayAlert} task{todayAlert>1?"s":""} need attention</span>
            </div>
          )}
          <button onClick={openAdd} style={S.btn("#1e3a5f")}>+ New Task</button>
        </div>

        <div style={{flex:1,overflow:"auto",padding:"24px 28px"}}>
          {tab==="dashboard"&&<Dashboard tasks={tasks} onAddTask={openAdd}/>}
          {tab==="tasks"&&<TasksView tasks={tasks} onEdit={openEdit} onDelete={deleteTask} onStatusChange={statusChange} onAddTask={openAdd}/>}
          {tab==="summarize"&&(
            <div style={{maxWidth:700}}>
              <SummarizeBox onAddTask={t=>{saveTask(t);setTab("tasks");}}/>
              <div style={S.card}>
                <div style={{fontWeight:700,fontSize:15,color:"#0f172a",marginBottom:4}}>📌 How to use AI Paste</div>
                <div style={{fontSize:13,color:"#64748b",lineHeight:1.8}}>
                  1. Copy any text — email, ticket, meeting notes, anything<br/>
                  2. Paste it into the box above<br/>
                  3. Select the campus or staff section it belongs to<br/>
                  4. Click "Summarize & Extract" — AI creates the task automatically<br/>
                  5. Review and click "Add" to save it
                </div>
              </div>
            </div>
          )}
        </div>
      </div>

      {showModal&&<TaskModal task={editingTask} onSave={saveTask} onClose={()=>{setShowModal(false);setEditingTask(null);}}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
    </script>
  </body>
</html>
